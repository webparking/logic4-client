name: Build Logic4 QA beta

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a beta tag and GitHub prerelease
        required: true
        default: false
        type: boolean
      base_version:
        description: SemVer base such as 4.1.0; defaults to the BETA_BASE_VERSION repository variable
        required: false
        type: string
  schedule:
    - cron: '0 8 * * *'

permissions: {}

concurrency:
  group: logic4-qa-beta
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.generate.outputs.base_sha }}
      has_changes: ${{ steps.generate.outputs.has_changes }}
      qa_version: ${{ steps.generate.outputs.qa_version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: pcov

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate QA client
        id: generate
        shell: bash
        run: |
          set -euo pipefail

          composer generate-beta-endpoints
          git add --all src

          echo "base_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

          if git diff --cached --quiet -- src; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "## Logic4 QA beta" >> "${GITHUB_STEP_SUMMARY}"
            echo "No generated source changes were found." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          qa_version="$(jq -er '.info.version' logic4-api-qa-V30.json)"
          if [[ ! "${qa_version}" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Unexpected Logic4 QA version: ${qa_version}" >&2
            exit 1
          fi

          echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          echo "qa_version=${qa_version}" >> "${GITHUB_OUTPUT}"

      - name: Run quality gates
        if: steps.generate.outputs.has_changes == 'true'
        run: composer test

      - name: Prepare beta candidate
        if: steps.generate.outputs.has_changes == 'true'
        env:
          QA_VERSION: ${{ steps.generate.outputs.qa_version }}
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- . ':(exclude)src/**'; then
            echo "Generation changed files outside src:" >&2
            git diff --name-only -- . ':(exclude)src/**' >&2
            exit 1
          fi

          git add --all src
          git diff --cached --check
          git diff --cached --binary -- src > beta.patch
          sha256sum beta.patch > beta.patch.sha256

          jq -n \
            --arg base_sha "${GITHUB_SHA}" \
            --arg qa_version "${QA_VERSION}" \
            --arg source_url "https://qa.api.logic4server.nl/scalar/#latest-version" \
            '{base_sha: $base_sha, qa_version: $qa_version, source_url: $source_url}' \
            > beta-metadata.json

          echo "## Logic4 QA beta candidate" >> "${GITHUB_STEP_SUMMARY}"
          echo "QA build: \`${QA_VERSION}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "Base commit: \`${GITHUB_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo '```text' >> "${GITHUB_STEP_SUMMARY}"
          git diff --cached --stat -- src >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload beta candidate
        if: steps.generate.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logic4-qa-beta-${{ github.run_id }}
          path: |
            beta.patch
            beta.patch.sha256
            beta-metadata.json
          if-no-files-found: error
          retention-days: 7

  release:
    if: needs.generate.outputs.has_changes == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/master'
    needs: generate
    runs-on: ubuntu-latest
    environment: beta-release
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.generate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: pcov

      - name: Download beta candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: logic4-qa-beta-${{ github.run_id }}
          path: .beta-artifact

      - name: Verify beta candidate
        working-directory: .beta-artifact
        run: sha256sum --check beta.patch.sha256

      - name: Apply beta candidate
        run: git apply --index .beta-artifact/beta.patch

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run quality gates
        run: |
          composer validate --strict
          composer test
          git diff --exit-code
          git diff --cached --check

      - name: Publish beta release
        id: release
        env:
          DEFAULT_BASE_VERSION: ${{ vars.BETA_BASE_VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QA_VERSION: ${{ needs.generate.outputs.qa_version }}
          REQUESTED_BASE_VERSION: ${{ inputs.base_version }}
        shell: bash
        run: |
          set -euo pipefail

          base_version="${REQUESTED_BASE_VERSION:-${DEFAULT_BASE_VERSION:-}}"
          if [[ ! "${base_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Set a valid base_version input or BETA_BASE_VERSION repository variable." >&2
            exit 1
          fi

          git fetch --force --tags origin
          latest_beta_tag="$(git tag --list "v${base_version}-beta.*" --sort=-v:refname | head -n 1)"

          if [[ -n "${latest_beta_tag}" ]] && git diff --quiet "${latest_beta_tag}" -- src; then
            echo "The generated source already matches ${latest_beta_tag}."
            echo "published=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          sequence=0
          while IFS= read -r existing_tag; do
            suffix="${existing_tag##*.}"
            if [[ "${suffix}" =~ ^[0-9]+$ ]] && (( suffix > sequence )); then
              sequence="${suffix}"
            fi
          done < <(git tag --list "v${base_version}-beta.*")

          tag="v${base_version}-beta.$((sequence + 1))"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Generate Logic4 QA client for ${tag}"
          git tag --annotate "${tag}" --message "${tag}"

          basic_auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${basic_auth}"
          git push origin "refs/tags/${tag}"
          git config --local --unset-all http.https://github.com/.extraheader
          trap - EXIT

          {
            echo "Generated from Logic4 QA build \`${QA_VERSION}\`."
            echo
            echo "Base commit: \`${GITHUB_SHA}\`"
            echo "Documentation: https://qa.api.logic4server.nl/scalar/#latest-version"
          } > beta-release-notes.md

          gh release create "${tag}" .beta-artifact/beta-metadata.json \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --title "${tag}" \
            --notes-file beta-release-notes.md

          echo "published=true" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Published ${tag}." >> "${GITHUB_STEP_SUMMARY}"
